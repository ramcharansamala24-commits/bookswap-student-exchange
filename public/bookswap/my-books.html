<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Books — BookSwap</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar" id="navbar"></header>

    <main class="section">
      <div class="container">
        <!-- Shown when the user is NOT logged in -->
        <div id="loginNotice" class="hidden"></div>

        <!-- Shown when the user IS logged in -->
        <div id="myBooksContent" class="hidden">
          <h1 class="page-title">My Books</h1>
          <p class="page-subtitle">These are the books you have added. You can edit or delete them.</p>
          <p><a class="btn" href="add-book.html">+ Add New Book</a></p>
          <div id="myBooksEmpty" style="margin-top: 18px"></div>
          <div class="book-grid" id="myBooks" style="margin-top: 18px"></div>
        </div>
      </div>
    </main>

    <footer class="footer"><p>BookSwap — Online Book Exchange Platform</p></footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
