<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — BookSwap</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar" id="navbar"></header>

    <main class="section">
      <div class="container">
        <div class="card form-card">
          <h1 class="page-title">Login to BookSwap</h1>
          <p class="page-subtitle">Login to add books and manage your listings.</p>

          <div id="formMessage" class="message hidden"></div>

          <form id="loginForm" novalidate>
            <div class="form-row">
              <label for="loginEmail">Email *</label>
              <input type="email" id="loginEmail" placeholder="ram@college.edu" />
            </div>
            <div class="form-row">
              <label for="loginPassword">Password *</label>
              <input type="password" id="loginPassword" placeholder="******" />
            </div>
            <div class="form-actions">
              <button class="btn" type="submit">Login</button>
              <a class="btn btn-outline" href="index.html">Cancel</a>
            </div>
          </form>

          <p class="hint">New here? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </main>

    <footer class="footer"><p>BookSwap — Online Book Exchange Platform</p></footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
