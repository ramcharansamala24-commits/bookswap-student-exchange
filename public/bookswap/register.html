<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — BookSwap</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar" id="navbar"></header>

    <main class="section">
      <div class="container">
        <div class="card form-card">
          <h1 class="page-title">Create your account</h1>
          <p class="page-subtitle">Register with your college details to start exchanging books.</p>

          <div id="formMessage" class="message hidden"></div>

          <form id="registerForm" novalidate>
            <div class="form-row">
              <label for="fullName">Full Name *</label>
              <input type="text" id="fullName" placeholder="Ram Charan" />
            </div>

            <div class="form-grid">
              <div class="form-row">
                <label for="email">Email *</label>
                <input type="email" id="email" placeholder="ram@college.edu" />
              </div>
              <div class="form-row">
                <label for="password">Password * (minimum 6 characters)</label>
                <input type="password" id="password" placeholder="******" />
              </div>
            </div>

            <div class="form-row">
              <label for="college">College Name *</label>
              <input type="text" id="college" placeholder="ABC Institute of Technology" />
            </div>

            <div class="form-grid">
              <div class="form-row">
                <label for="department">Department *</label>
                <input type="text" id="department" placeholder="Computer Science" />
              </div>
              <div class="form-row">
                <label for="year">Year of Study *</label>
                <select id="year">
                  <option value="">Select year</option>
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button class="btn" type="submit">Register</button>
              <a class="btn btn-outline" href="index.html">Cancel</a>
            </div>
          </form>

          <p class="hint">Already have an account? <a href="login.html">Login here</a></p>
          <p class="hint">Note: this is a simple demo login system that stores data in your browser's LocalStorage. It is not real secure authentication.</p>
        </div>
      </div>
    </main>

    <footer class="footer"><p>BookSwap — Online Book Exchange Platform</p></footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/books.js"></script>
  </body>
</html>
